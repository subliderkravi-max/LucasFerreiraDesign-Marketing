<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BlackGold - Lucas Ferreira Design</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#070707;
  color:#fff;
  overflow-x:hidden;
}

/* NAVBAR */
nav{
  width:100%;
  display:flex;
  justify-content:center;
  gap:40px;
  padding:20px;
  font-weight:500;
  letter-spacing:2px;
}

nav a{
  color:#fff;
  text-decoration:none;
  transition:.3s;
}

nav a:hover{
  color:#d4af37;
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:60px;
}

.left{
  max-width:600px;
}

.left h1{
  font-size:4rem;
  font-weight:800;
  color:#d4af37;
}

.left h2{
  font-size:1.5rem;
  margin-top:10px;
  color:#fff;
}

.left p{
  margin-top:20px;
  line-height:1.8;
  color:#bbb;
  font-size:1.05rem;
}

/* BOTÃO */
.btn{
  display:inline-block;
  margin-top:30px;
  padding:14px 28px;
  border:1px solid #d4af37;
  color:#d4af37;
  text-decoration:none;
  font-weight:600;
  letter-spacing:2px;
  transition:.3s;
}

.btn:hover{
  background:#d4af37;
  color:#000;
}

/* DIREITA */
.right{
  position:relative;
}

.avatar{
  width:420px;
  height:auto;
  border-radius:10px;
  object-fit:cover;
  box-shadow:0 0 40px rgba(212,175,55,0.25);
}

/* FOOTER SOCIAL */
footer{
  position:fixed;
  bottom:20px;
  right:20px;
  display:flex;
  gap:15px;
}

footer a{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#111;
  border:1px solid #333;
  text-decoration:none;
  font-size:18px;
  color:#fff;
  transition:.3s;
}

footer a:hover{
  background:#d4af37;
  color:#000;
}

/* SCROLL TEXT */
.scroll{
  position:fixed;
  bottom:20px;
  left:20px;
  writing-mode:vertical-rl;
  text-orientation:mixed;
  font-size:0.9rem;
  color:#bbb;
  letter-spacing:2px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
  <a href="#">SAYS</a>
  <a href="#">ABOUT</a>
  <a href="#">PROVERBS</a>
  <a href="#">POEM</a>
  <a href="#">LESSON</a>
</nav>

<!-- HERO -->
<section class="hero">

  <!-- ESQUERDA -->
  <div class="left">
    <h1>BlackGold</h1>
    <h2>Now it’s new black and old gold</h2>
    <p>
      And only now, only this time it is a whole new culture in every part of art and design
    </p>

    <!-- BOTÃO COM INFORMAÇÕES -->
    <a href="#" class="btn">
      Contato: (51) 99203-3109<br>
      E-mail: lucfsv@gmail.com<br>
      Instagram: @fslucs
    </a>
  </div>

  <!-- DIREITA -->
  <div class="right">
    <img class="avatar" src="https://copilot.microsoft.com/th/id/BCO.c3fe4ef2-8dfe-4e59-b017-e28fb49642d3.png" alt="Escultura com máscara dourada">
  </div>

</section>

<!-- SCROLL -->
<div class="scroll">scroll down</div>

<!-- FOOTER SOCIAL -->
<footer>
  <a href="https://facebook.com" target="_blank">f</a>
  <a href="https://instagram.com/fslucs" target="_blank">📷</a>
  <a href="https://twitter.com" target="_blank">t</a>
</footer>

</body>
</html>
