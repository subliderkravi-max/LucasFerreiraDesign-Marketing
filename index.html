<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BlackGold - Lucas Ferreira Design</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#070707;
  color:#fff;
  overflow-x:hidden;
}

/* SEÇÃO PRINCIPAL */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:60px;
}

/* LADO ESQUERDO */
.left{
  max-width:600px;
}

.left h1{
  font-size:4rem;
  font-weight:800;
  color:#d4af37;
}

.left h2{
  font-size:1.5rem;
  margin-top:10px;
  color:#fff;
}

.left p{
  margin-top:20px;
  line-height:1.8;
  color:#bbb;
  font-size:1.05rem;
}

/* BOTÃO DE CONTATO */
.btn{
  display:inline-block;
  margin-top:30px;
  padding:14px 28px;
  border:1px solid #d4af37;
  color:#d4af37;
  text-decoration:none;
  font-weight:600;
  letter-spacing:2px;
  transition:.3s;
}

.btn:hover{
  background:#d4af37;
  color:#000;
}

/* LADO DIREITO (IMAGEM) */
.right{
  position:relative;
}

.avatar{
  width:420px;
  height:auto;
  border-radius:10px;
  object-fit:cover;
  box-shadow:0 0 40px rgba(212,175,55,0.25);
}

/* TEXTO SCROLL */
.scroll{
  position:fixed;
  bottom:20px;
  left:20px;
  writing-mode:vertical-rl;
  text-orientation:mixed;
  font-size:0.9rem;
  color:#bbb;
  letter-spacing:2px;
}
</style>
</head>

<body>

<!-- CONTEÚDO PRINCIPAL -->
<section class="hero">

  <!-- ESQUERDA -->
  <div class="left">
    <h1>BlackGold</h1>
    <h2>Agora é o novo preto e o velho ouro</h2>
    <p>
      E só agora, apenas neste momento, nasce uma nova cultura em cada parte da arte e do design.
    </p>

    <!-- BOTÃO COM SEU CONTATO -->
    <a href="#" class="btn">
      📱 Contato: (51) 99203-3109<br>
      ✉️ E-mail: lucfsv@gmail.com<br>
      📷 Instagram: @fslucs
    </a>
  </div>

  <!-- DIREITA (IMAGEM) -->
  <div class="right">
    <img class="avatar" src="https://copilot.microsoft.com/th/id/BCO.c3fe4ef2-8dfe-4e59-b017-e28fb49642d3.png" alt="Escultura preta com máscara dourada">
  </div>

</section>

<!-- TEXTO SCROLL -->
<div class="scroll">rolar para baixo</div>

</body>
</html>
